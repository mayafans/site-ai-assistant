# 反代注入网关的公网入口（示例：ai.example.com）
# 网关自己不带鉴权，是不限定目标的开放代理 —— 公网入口必须加一层访问控制。
# 放置：/etc/nginx/conf.d/ai.example.com.conf，然后 nginx -t && nginx -s reload

server {
    listen 80;
    server_name ai.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.example.com;

    ssl_certificate     /etc/letsencrypt/live/ai.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 访问控制：Basic Auth（推荐）。生成口令：
    #   apt-get install -y apache2-utils && htpasswd -c /etc/nginx/.htpasswd-gw yourname
    auth_basic           "site assistant gateway";
    auth_basic_user_file /etc/nginx/.htpasswd-gw;

    client_max_body_size 20m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket（被代理站点的实时连接会透传到这里）
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_buffering    off;
    }
}
