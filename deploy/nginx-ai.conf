# Nginx 反向代理示例：/ai/* → Node 助手服务
# 放到站点 server{} 里；同源部署，免 CORS

location /ai/ {
    proxy_pass http://127.0.0.1:8820/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE 关键：关闭缓冲，逐字下发
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    chunked_transfer_encoding on;
}

# 管理后台只允许内网
location = /ai/admin {
    allow 10.0.0.0/8;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8820/admin;
}

# widget 可短缓存，改版时改文件名或加版本号
location = /ai/widget.js {
    proxy_pass http://127.0.0.1:8820/widget.js;
    add_header Cache-Control "public, max-age=300";
    add_header Access-Control-Allow-Origin "*";
}
